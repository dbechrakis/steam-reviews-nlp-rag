name: Code, tests and evidence
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install local package and API contract-test dependencies
        run: |
          python -m pip install --no-deps -e .
          python -m pip install pandas==2.2.3 fastapi==0.143.0 httpx2==2.13.1
      - name: Lint application code
        run: |
          python -m pip install ruff==0.16.9
          ruff check app.py deploy src tests scripts --select E4,E7,E9,F
      - name: Validate committed evidence
        run: python ci/verify_evidence.py
      - name: Recompute recorded retrieval benchmark metrics
        run: python scripts/verify_retrieval_evidence.py
      - name: Run focused unit tests
        env:
          CI: 'true'
        run: python -m unittest discover -s tests -v
