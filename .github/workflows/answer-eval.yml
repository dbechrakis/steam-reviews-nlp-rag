# Generate answers for the 80 benchmark questions with the production model, then judge every
# claim against the evidence the generator saw. Manual only because it spends Groq tokens.
name: Answer evaluation
on:
  workflow_dispatch:
    inputs:
      judge_model:
        description: Groq model that judges the claims
        default: openai/gpt-oss-20b
      resume:
        description: Keep finished work in the committed run, regenerate failed answers and judge what is missing
        type: boolean
        default: false
      commit_results:
        description: Commit the result files to the branch this run was started from
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  answers:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TOKENIZERS_PARALLELISM: 'false'
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - name: Require the Groq key
        run: |
          test -n "$GROQ_API_KEY" || { echo "Add a repository secret named GROQ_API_KEY under Settings, Secrets and variables, Actions."; exit 1; }
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Cache pinned artifacts and models
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            outputs/rag
            ~/.cache/huggingface
          key: rag-${{ hashFiles('src/steam_review_rag/artifacts.py', 'evaluation/benchmark.json') }}
      - run: python -m pip install -r requirements-api.txt && python -m pip install --no-deps -e .
      - name: Unit tests
        run: python -m unittest tests.test_answer_eval -v
      - name: Generate answers with the production model
        if: "!inputs.resume"
        run: python scripts/evaluate_retrieval.py --generate --output outputs/evaluation/generated-v1
      - name: Judge the claims
        run: python scripts/evaluate_answers.py --run outputs/evaluation/generated-v1 --judge-model "${{ inputs.judge_model }}" ${{ inputs.resume && '--resume --regenerate-failed' || '' }}
      - name: Show the summary
        run: cat outputs/evaluation/generated-v1/answer_eval_summary.md | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: answer-eval-run
          path: outputs/evaluation/generated-v1
      - name: Commit the result files
        if: inputs.commit_results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f outputs/evaluation/generated-v1/per_query.json outputs/evaluation/generated-v1/manifest.json \
            outputs/evaluation/generated-v1/answer_eval.json outputs/evaluation/generated-v1/answer_eval_summary.md
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "Record the generated-answer evaluation run"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
