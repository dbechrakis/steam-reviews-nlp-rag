# Re-run the 80-question retrieval benchmark with the real models and block regressions,
# then build the API image and query it end to end.
name: Retrieval gate
on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/evaluate_retrieval.py'
      - 'scripts/check_retrieval_regression.py'
      - 'evaluation/**'
      - 'requirements-api.txt'
      - 'Dockerfile'
      - '.github/workflows/retrieval-gate.yml'
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Cache pinned artifacts and models
        uses: actions/cache@v4
        with:
          path: |
            outputs/rag
            ~/.cache/huggingface
          key: rag-${{ hashFiles('src/steam_review_rag/artifacts.py', 'evaluation/benchmark.json') }}
      - run: python -m pip install -r requirements-api.txt && python -m pip install --no-deps -e .
      - name: Run the benchmark with real retrieval
        run: python scripts/evaluate_retrieval.py --output outputs/evaluation/ci-run
      - name: Compare with the committed baseline
        run: python scripts/check_retrieval_regression.py --run outputs/evaluation/ci-run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-ci-run
          path: outputs/evaluation/ci-run
  api-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build image with baked artifacts and models
        run: docker build -t steam-review-api .
      - name: Query the running container
        run: |
          docker run -d --name api -p 8000:8000 steam-review-api
          for i in $(seq 1 90); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf localhost:8000/health
          curl -sf -X POST localhost:8000/search -H 'content-type: application/json' \
            -d '{"question": "A relaxing farming game to play after work", "evidence_count": 3}' \
            | python3 -c 'import json,sys; r=json.load(sys.stdin); assert len(r["evidence"]) == 3; [print(e["rank"], e["game_name"], round(e["rerank_score"], 2)) for e in r["evidence"]]'
          curl -sf -X POST localhost:8000/answer -H 'content-type: application/json' \
            -d '{"question": "Is Hades worth it?"}' \
            | python3 -c 'import json,sys; r=json.load(sys.stdin); assert r["generation_status"] == "not_configured" and r["evidence"]; print("answer endpoint ok in evidence-only mode")'
      - name: Container logs
        if: always()
        run: docker logs api || true
