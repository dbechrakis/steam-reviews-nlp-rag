[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "steam-review-rag"
version = "1.0.0"
description = "Evidence-grounded retrieval and generation over Steam player reviews."
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B905", "B023"]

[tool.ruff.lint.per-file-ignores]
"scripts/evaluate_answers.py" = ["I", "UP"]
"scripts/evaluate_retrieval.py" = ["I", "UP"]
"src/steam_review_rag/answer_eval.py" = ["I", "UP"]
"src/steam_review_rag/evaluation.py" = ["I", "UP"]
"src/steam_review_rag/prompting.py" = ["I", "UP"]
"src/steam_review_rag/retrieval.py" = ["I", "UP"]
